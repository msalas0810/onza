# Despliegue en Cloudflare Workers. Vercel sigue desplegando por su integración con Git hasta el cambio de dominio.
# No corre hasta que el dueño cree la variable de repositorio CLOUDFLARE_DEPLOY_ENABLED=true (ver README «Despliegue»).
name: Deploy Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Entorno
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
concurrency:
  group: deploy-workers-${{ inputs.target || 'preview' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((inputs.target || 'preview') == 'preview' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run cf:deploy:${{ inputs.target || 'preview' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
